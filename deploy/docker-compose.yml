# ─────────────────────────────────────────────────────────
# OpenClaw Production Docker Compose — PositionedUp Squad
# For: Hostinger VPS / Hetzner / Any Ubuntu VPS
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs -f
# ─────────────────────────────────────────────────────────
services:
  # ── OpenClaw Gateway (agent runtime) ─────────────────
  openclaw-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: positionedup-openclaw:latest
    container_name: openclaw-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOME=/home/openclaw
      - NODE_ENV=production
      - TERM=xterm-256color
    volumes:
      - openclaw-config:/home/openclaw/.openclaw
      - openclaw-workspace:/home/openclaw/.openclaw/workspace
    ports:
      - "127.0.0.1:18789:18789"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Caddy Reverse Proxy (HTTPS + security headers) ──
  # Only enable if you have a domain pointed to this VPS.
  # Comment out this entire service if using SSH tunnel only.
  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    environment:
      - OPENCLAW_DOMAIN=${OPENCLAW_DOMAIN:-agents.positionedup.com}
      - ACME_EMAIL=${ACME_EMAIL:-admin@positionedup.com}
    depends_on:
      openclaw-gateway:
        condition: service_healthy
    profiles:
      - https

  # ── Watchtower (auto-update containers) ──────────────
  # Checks for new image versions every 6 hours
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=21600
      - WATCHTOWER_LABEL_ENABLE=false
    profiles:
      - auto-update

volumes:
  openclaw-config:
    driver: local
  openclaw-workspace:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  caddy-logs:
    driver: local
